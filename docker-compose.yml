# Production-style stack: PostgreSQL, Redis, API, web UI, nginx reverse proxy.
# Copy server/.env.example and frontend/.env.production.example into real env files and adjust secrets.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dms
    volumes:
      - dms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dms?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/storage
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      # Set real secrets via env file or Docker secrets in real deployments
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme-change-me-at-least-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme-change-me-at-least-32-chars!!}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-changeme-change-me-at-least-32-chars!!}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-http://localhost}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost}
    volumes:
      - dms_storage:/data/storage
    expose:
      - "4000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_BILLING_ENABLED: ${NEXT_PUBLIC_BILLING_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  dms_pg:
  dms_storage:
